[package]
name = "decoder-cli"
description = "Native tooling: data build, benchmarks, simulation, table fitting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mdcd"
path = "src/main.rs"

[dependencies]
decoder-core.workspace = true
rayon = "1"
regex = "1"
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
