[workspace]
members = ["crates/decoder-core", "crates/decoder-wasm", "crates/decoder-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
decoder-core = { path = "crates/decoder-core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Release speed with debug assertions, for property tests on large inputs.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
panic = "unwind"
